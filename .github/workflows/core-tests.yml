name: JARVIS Core Tests
on:
  push:
    branches: [feature/jarvis-core-architecture-day02, feature/jarvis-project-observability]
    paths:
      - 'core/**'
      - 'server/**'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: python -m compileall -q core server
      - name: Run core unit tests
        run: PYTHONPATH=core python -m unittest discover -s core/tests -v
