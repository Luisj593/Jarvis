name: JARVIS APK desarrollo
on:
  workflow_dispatch:
  push:
    branches:
      - feature/jarvis-core-architecture-day02
      - feature/openai-bridge-20261123
    paths:
      - 'app/**'
      - '.github/workflows/android-development.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar modelo local español
        run: |
          curl --fail --location --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip -o /tmp/vosk-es.zip
          unzip -q /tmp/vosk-es.zip -d /tmp/vosk-es
          mkdir -p app/src/main/assets
          mv /tmp/vosk-es/vosk-model-small-es-0.42 app/src/main/assets/model-es
          echo 'vosk-small-es-0.42' > app/src/main/assets/model-es/uuid
      - name: Pruebas de regresión conversacional
        run: gradle :app:testDebugUnitTest --console=plain --no-daemon
      - name: Compilar APK
        run: gradle :app:assembleDebug --console=plain --no-daemon
      - name: Validar APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Neon-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
