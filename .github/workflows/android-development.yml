name: JARVIS APK desarrollo
on:
  workflow_dispatch:
  push:
    branches:
      - feature/jarvis-core-architecture-day02
      - feature/openai-bridge-20261123
      - feature/jarvis-unified-20261124
    paths:
      - 'app/**'
      - '.github/workflows/android-development.yml'
concurrency:
  group: jarvis-development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar modelo local español
        run: |
          curl --fail --location --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip -o /tmp/vosk-es.zip
          unzip -q /tmp/vosk-es.zip -d /tmp/vosk-es
          mkdir -p app/src/main/assets
          mv /tmp/vosk-es/vosk-model-small-es-0.42 app/src/main/assets/model-es
          echo 'vosk-small-es-0.42' > app/src/main/assets/model-es/uuid
      - name: Pruebas de regresión conversacional
        run: gradle :app:testDebugUnitTest --console=plain --no-daemon
      - name: Compilar APK
        run: gradle :app:assembleDebug --console=plain --no-daemon
      - name: Validar APK
        run: |
          python3 - <<'PY'
          import zipfile
          p = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              assert z.testzip() is None, 'APK corrupta'
              for required in ['AndroidManifest.xml','classes.dex','assets/model-es/uuid','assets/model-es/am/final.mdl','assets/model-es/conf/model.conf']:
                  assert required in names, f'Falta {required}'
              assert any(n.startswith('lib/') and n.endswith('/libvosk.so') for n in names), 'Falta biblioteca Vosk'
          print('APK y modelo local verificados')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversation-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Neon-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
