name: Compilar APK JARVIS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de pruebas
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Comprobar APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
